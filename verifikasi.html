<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi Tanda Tangan · SmartFin BIMA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/favicon-32.png">
<style>
:root{--ink:#141619;--muted:#6B6F76;--line:#E2DFD8;--canvas:#F8F7F4;--brand:#D94E34;--ok:#2F8A4E;--okbg:#E3F4E8;--bad:#B4352A;--badbg:#FBE7E4;--warnbg:#FFF4DC;--warn:#9A6B00}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:3px}
.brand b{display:block;font-size:16px}.brand span{font-size:12.5px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.status{display:flex;gap:12px;align-items:center;border-radius:12px;padding:14px 16px;margin-bottom:18px}
.status svg{flex:none;width:30px;height:30px}
.status b{display:block;font-size:17px}.status span{font-size:13px}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}
dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
dt{color:var(--muted);font-size:13px}dd{margin:0;font-weight:600;word-break:break-word}
.amt{font-size:20px;color:var(--brand)}
h2{font-size:14px;margin:20px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.sig{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.sig.me{border-color:var(--brand);background:#FDF3F0}
.sig small{display:block;color:var(--muted);font-size:12px}
.sig .t{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.code{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;font-size:12.5px}
.foot{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
.load{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="logo-bima.png" alt="Logo BIMA"><div><b>Verifikasi Tanda Tangan Digital</b><span>SmartFin · Bilal Mitra Aryatama</span></div></div>
  <div class="card" id="out"><div class="load">Memeriksa kode…</div></div>
  <div class="foot">Halaman ini membaca langsung dari database SmartFin. Cocokkan nomor bukti, nilai, dan nama penandatangan dengan dokumen yang Anda pegang.</div>
</div>
<script>
const SUPABASE_URL = 'https://nhmpwjriextmbotmvvbu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XNqLw7iz873TtrLn9ag8dQ_AkL2rImz';
const out = document.getElementById('out');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ICON = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>',
  bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>'
};
const status = (kind, title, sub) => { const s = el('div', 'status ' + kind); s.innerHTML = ICON[kind]; const t = el('div'); t.append(el('b', null, title), el('span', null, sub)); s.append(t); return s; };
const wita = (ts, dateOnly) => {
  if (!ts) return '-';
  const d = new Date(ts), z = { timeZone: 'Asia/Makassar' };
  const hm = new Intl.DateTimeFormat('en-GB', Object.assign({ hour: '2-digit', minute: '2-digit', hour12: false }, z)).format(d);
  const day = new Intl.DateTimeFormat('id-ID', Object.assign({ day: '2-digit', month: 'long', year: 'numeric' }, z)).format(d);
  return dateOnly || hm === '00:00' ? day : `${day} ${hm} WITA`;
};
const rp = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });

(async () => {
  const code = (new URLSearchParams(location.search).get('k') || '').trim().toUpperCase();
  out.textContent = '';
  if (!/^SF-[0-9A-F]{16}$/.test(code)) { out.append(status('bad', 'Kode tidak valid', 'Format kode tanda tangan tidak dikenal.')); return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/fin_verify_sign`, { method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_code: code }) });
    if (!res.ok) throw new Error();
    const d = await res.json();
    if (!d || !d.found) { out.append(status('bad', 'Tidak ditemukan', 'Kode ' + code + ' tidak terdaftar di SmartFin. Dokumen ini patut dicurigai.')); return; }
    out.append(d.valid
      ? status('ok', 'Tanda tangan sah', `${d.name} · ${d.role}`)
      : status('warn', 'Tidak berlaku', 'Tanda tangan terdaftar, tetapi transaksi sumbernya sudah tidak berstatus final.'));
    const dl = el('dl');
    const row = (k, v, cls) => { dl.append(el('dt', null, k), el('dd', cls, v || '-')); };
    row('Nomor bukti', d.voucher_no);
    row('Jenis', d.kind_label);
    row('Tanggal bayar', wita(d.date, true));
    row('Dibayar kepada', d.payee);
    row('Nilai', rp(d.amount), 'amt');
    row('Dari rekening', d.bank_label);
    row('Kode proyek', d.project_code);
    row('Kode QR ini', code, 'code');
    out.append(dl);
    out.append(el('h2', null, 'Penandatangan'));
    (d.signs || []).forEach((g) => {
      const s = el('div', 'sig' + (g.me ? ' me' : ''));
      const l = el('div'); l.append(el('b', null, g.name), el('small', null, g.role + (g.me ? ' · QR yang dipindai' : '')));
      s.append(l, el('div', 't', wita(g.at)));
      out.append(s);
    });
  } catch (e) {
    out.append(status('warn', 'Tidak bisa memeriksa', 'Koneksi ke server gagal. Coba lagi beberapa saat.'));
  }
})();
</script>
</body>
</html>
